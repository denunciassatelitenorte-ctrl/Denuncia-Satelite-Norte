<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración | Unidad Educativa Satélite Norte</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  :root{
    --rojo: #B91C2C;
    --rojo-oscuro: #8F1522;
    --celeste: #0E8FC4;
    --celeste-oscuro: #0B6E99;
    --tinta: #10161F;
    --gris-800: #2B3440;
    --gris: #667085;
    --gris-claro: #98A2B3;
    --fondo: #F4F6F9;
    --borde: #E3E7EE;
    --superficie: #FFFFFF;
    --exito: #157F4A;
    --exito-fondo: #E8F6EE;
    --ambar: #B7791F;
    --ambar-fondo: #FDF3E3;
    --radio-lg: 16px;
    --radio-md: 10px;
    --sombra: 0 1px 2px rgba(16,24,40,.04), 0 10px 28px -12px rgba(16,24,40,.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter', system-ui, sans-serif;
    background: var(--fondo);
    color: var(--tinta);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Source Serif 4', Georgia, serif; }

  .franja{ height:6px; display:flex; }
  .franja span{flex:1;}
  .franja .r{background:var(--rojo);}
  .franja .c{background:var(--celeste);}
  .franja .b{background:var(--superficie); border-top:1px solid var(--borde); border-bottom:1px solid var(--borde);}

  header{
    background: linear-gradient(160deg, var(--rojo-oscuro) 0%, var(--rojo) 42%, var(--celeste-oscuro) 100%);
    color:var(--superficie);
    padding: 26px 20px;
  }
  .header-inner{
    max-width: 1000px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  header h1{ margin:0; font-size:1.3rem; }
  header p{ margin:4px 0 0; font-size:.82rem; opacity:.85; }
  #btnSalir{
    background:rgba(255,255,255,.15);
    color:#fff;
    border:1px solid rgba(255,255,255,.4);
    border-radius:var(--radio-md);
    padding:9px 16px;
    font-family:inherit;
    font-weight:600;
    font-size:.85rem;
    cursor:pointer;
    display:none;
  }
  #btnSalir:hover{ background:rgba(255,255,255,.25); }

  main{ max-width:1000px; margin:0 auto; padding:28px 20px 60px; }

  /* ---- Login ---- */
  #vistaLogin{
    max-width:380px;
    margin: 60px auto;
    background:var(--superficie);
    border:1px solid var(--borde);
    border-radius:var(--radio-lg);
    padding:32px 28px;
    box-shadow: var(--sombra);
  }
  #vistaLogin h2{ margin:0 0 6px; font-size:1.25rem; }
  #vistaLogin p.subtexto{ color:var(--gris); font-size:.85rem; margin:0 0 20px; }
  label{ display:block; font-size:.85rem; font-weight:600; margin-bottom:7px; color:var(--gris-800); }
  input[type=email], input[type=password]{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--borde);
    border-radius:var(--radio-md);
    font-size:.94rem;
    font-family:inherit;
    background:#FBFCFD;
    color:var(--tinta);
    margin-bottom:14px;
  }
  input:focus{
    outline:none;
    border-color:var(--celeste);
    background:var(--superficie);
    box-shadow: 0 0 0 4px rgba(14,143,196,.12);
  }
  button{
    font-family:inherit;
    font-size:.88rem;
    font-weight:600;
    border:none;
    border-radius:var(--radio-md);
    padding:12px 20px;
    cursor:pointer;
  }
  button:hover{ opacity:.9; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-celeste{ background:var(--celeste); color:var(--superficie); width:100%; }
  .estado-login{ font-size:.83rem; margin-top:12px; font-weight:600; color:var(--rojo); min-height:18px; }

  /* ---- Dashboard ---- */
  #vistaPanel{ display:none; }
  .resumen{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  .resumen .tarjetita{
    flex:1; min-width:140px;
    background:var(--superficie); border:1px solid var(--borde); border-radius:var(--radio-md);
    padding:16px; box-shadow: var(--sombra);
  }
  .resumen .tarjetita .num{ font-size:1.5rem; font-weight:700; font-family:'Source Serif 4', serif; }
  .resumen .tarjetita .etiqueta{ font-size:.78rem; color:var(--gris); margin-top:2px; }

  .buscador-wrap{ position:relative; margin-bottom:14px; }
  .buscador-wrap .icono-lupa{
    position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:1rem; color:var(--gris-claro); pointer-events:none;
  }
  #buscadorDenuncias{
    width:100%; padding:12px 14px 12px 38px; border:1.5px solid var(--borde); border-radius:999px;
    font-family:inherit; font-size:.9rem; background:var(--superficie); color:var(--tinta);
  }
  #buscadorDenuncias:focus{ outline:none; border-color:var(--celeste); box-shadow:0 0 0 4px rgba(14,143,196,.12); }
  .buscador-wrap .limpiar-busqueda{
    position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:var(--fondo);
    color:var(--gris); width:26px; height:26px; border-radius:999px; cursor:pointer; font-size:.85rem; display:none;
  }
  .buscador-wrap.tiene-texto .limpiar-busqueda{ display:block; }
  .contador-resultados{ font-size:.78rem; color:var(--gris); margin:-6px 0 14px; }

  .filtros{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }

  .grafico{
    background:var(--superficie); border:1px solid var(--borde); border-radius:var(--radio-lg);
    padding:20px 22px; box-shadow: var(--sombra); margin-bottom:22px;
  }
  .grafico h3{ margin:0 0 14px; font-size:1rem; }
  .barra-fila{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .barra-fila .etiqueta-barra{ width:150px; font-size:.78rem; color:var(--gris-800); flex-shrink:0; text-align:right; }
  .barra-fila .pista{ flex:1; background:var(--fondo); border-radius:999px; height:20px; overflow:hidden; }
  .barra-fila .relleno{ height:100%; background:linear-gradient(90deg, var(--celeste), var(--rojo)); border-radius:999px; transition:width .3s; }
  .barra-fila .num-barra{ width:26px; font-size:.8rem; font-weight:700; text-align:left; }
  .grafico .vacio-grafico{ font-size:.85rem; color:var(--gris); text-align:center; padding:10px 0; }
  .filtro{
    border:1.5px solid var(--borde); background:var(--superficie); color:var(--gris-800);
    padding:8px 14px; border-radius:999px; font-size:.82rem; font-weight:600; cursor:pointer;
  }
  .filtro.activo{ border-color:var(--celeste); background:var(--celeste); color:#fff; }

  .pestanas{ display:flex; gap:6px; margin-bottom:18px; border-bottom:2px solid var(--borde); overflow-x:auto; }
  .pestana{
    background:none; border:none; border-bottom:3px solid transparent; margin-bottom:-2px; border-radius:0;
    padding:12px 16px; font-size:.92rem; font-weight:700; color:var(--gris); cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:8px;
  }
  .pestana:hover{ color:var(--tinta); opacity:1; }
  @media (max-width:560px){
    .pestanas{ gap:0; overflow-x:visible; }
    .pestana{ flex:1; justify-content:center; padding:12px 4px; font-size:.8rem; gap:5px; flex-wrap:wrap; }
  }
  .pestana .cont{ background:var(--fondo); color:var(--gris-800); font-size:.75rem; padding:2px 9px; border-radius:999px; }
  .pestana.activa{ color:var(--celeste-oscuro); border-bottom-color:var(--celeste); }
  .pestana.activa .cont{ background:var(--celeste); color:#fff; }
  .pestana[data-filtro="Nueva"] .cont{ background:var(--ambar-fondo); color:var(--ambar); }
  .pestana[data-filtro="Resuelta"] .cont{ background:var(--exito-fondo); color:var(--exito); }
  .pestana.activa[data-filtro] .cont{ background:var(--celeste); color:#fff; }
  .panel-titulo{ font-size:.85rem; color:var(--gris); margin:0 0 14px; }
  .denuncia.en-revision{ border-left:4px solid var(--celeste); }
  .denuncia.resuelta{ border-left:4px solid var(--exito); }
  .etiquetas-estado{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .etiqueta-fija{ font-size:.74rem; font-weight:700; padding:4px 12px; border-radius:999px; background:#F1F3F7; color:var(--gris-800); border:1px solid var(--borde); user-select:none; }
  .pastilla-estado.Leida{ background:#F3EEFB; color:#6B3FA0; }
  .pastilla-estado.Espera{ background:var(--ambar-fondo); color:var(--ambar); }

  .lista-denuncias{ display:flex; flex-direction:column; gap:14px; }
  .denuncia{
    background:var(--superficie); border:1px solid var(--borde); border-radius:var(--radio-lg);
    padding:22px 24px; box-shadow: var(--sombra);
  }
  .denuncia.no-leida{ border-left:4px solid var(--ambar); }
  .punto-no-leida{
    display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ambar); margin-right:6px; flex-shrink:0;
  }
  .btn-toggle-leida{
    background:var(--fondo); color:var(--gris-800); border:1.5px solid var(--borde);
    padding:8px 14px; border-radius:var(--radio-md); font-size:.8rem; font-weight:600; cursor:pointer;
  }
  .btn-toggle-leida:hover{ background:var(--borde); }
  .denuncia-cabecera{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .denuncia-cabecera .codigo{ font-family:'Source Serif 4', serif; font-weight:700; font-size:1.05rem; }
  .denuncia-cabecera .fecha{ font-size:.78rem; color:var(--gris); }
  .etiqueta-tipo{
    display:inline-block; font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:999px;
    background:#FDF1F2; color:var(--rojo-oscuro); margin-top:6px;
  }
  .campo{ margin-top:14px; }
  .campo .rotulo{ font-size:.74rem; text-transform:uppercase; letter-spacing:.6px; color:var(--gris-claro); font-weight:700; margin-bottom:4px; }
  .campo .valor{ font-size:.92rem; color:var(--tinta); line-height:1.5; white-space:pre-wrap; }
  .miniaturas-admin{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .miniaturas-admin button{
    display:block; width:90px; height:90px; border-radius:8px; overflow:hidden; border:1px solid var(--borde);
    padding:0; cursor:pointer; background:none;
  }
  .miniaturas-admin img{ width:100%; height:100%; object-fit:cover; }

  .videos-admin{ display:flex; flex-direction:column; gap:12px; margin-top:6px; }
  .video-item{ background:#F7F9FB; border:1px solid var(--borde); border-radius:var(--radio-md); padding:10px; }
  .video-item .video-info{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:.82rem; color:var(--gris-800); }
  .video-item .video-info span{ word-break:break-all; }
  .btn-video{ background:var(--celeste); color:#fff; border:none; border-radius:var(--radio-md); padding:8px 14px; font-size:.8rem; font-weight:600; cursor:pointer; }
  .video-item video{ display:block; width:100%; max-height:420px; border-radius:8px; background:#000; margin-top:10px; }
  .video-item .video-error{ color:var(--rojo); font-size:.8rem; margin:8px 0 0; font-weight:600; }
  .visor-imagen{
    display:none; position:fixed; inset:0; background:rgba(10,14,20,.92);
    z-index:1000; align-items:center; justify-content:center; padding:24px;
  }
  .visor-imagen.activo{ display:flex; }
  .visor-imagen img{ max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .visor-imagen .cerrar-visor{
    position:absolute; top:18px; right:20px; background:rgba(255,255,255,.15); color:#fff;
    border:none; border-radius:999px; width:40px; height:40px; font-size:1.3rem; cursor:pointer;
  }
  .pie-denuncia{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap; }
  select.estado-select{
    padding:8px 12px; border-radius:var(--radio-md); border:1.5px solid var(--borde); font-family:inherit; font-size:.85rem; font-weight:600;
  }
  .pastilla-estado{ font-size:.74rem; font-weight:700; padding:4px 12px; border-radius:999px; }
  .pastilla-estado.Nueva{ background:var(--ambar-fondo); color:var(--ambar); }
  .pastilla-estado.En-revisión{ background:#EAF1FE; color:var(--celeste-oscuro); }
  .pastilla-estado.Resuelta{ background:var(--exito-fondo); color:var(--exito); }
  .vacio{ text-align:center; color:var(--gris); padding:40px 0; }

  /* ---- Encabezado institucional ---- */
  .marca{ display:flex; align-items:center; gap:16px; }
  .escudo-marco{ flex-shrink:0; width:68px; height:68px; border-radius:50%; background:var(--superficie); padding:4px; box-shadow:0 6px 18px rgba(0,0,0,.25); overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .escudo-marco img{ width:100%; height:100%; object-fit:cover; object-position:center 30%; transform:scale(1.5); }
  .titulo-institucion{ line-height:1.25; }
  .titulo-institucion .eyebrow{ font-size:.66rem; letter-spacing:1.6px; text-transform:uppercase; opacity:.8; font-weight:600; }
  .titulo-institucion h1{ margin:2px 0 3px; font-size:1.3rem; }
  .titulo-institucion p{ margin:0; font-size:.8rem; opacity:.88; }
  #vistaLogin{ text-align:center; }
  #vistaLogin label{ text-align:left; }
  .icono-login{ width:56px; height:56px; border-radius:16px; margin:0 auto 14px; background:#EAF6FC; color:var(--celeste-oscuro); display:flex; align-items:center; justify-content:center; }
  .icono-login svg{ width:28px; height:28px; }
  @media (max-width:520px){ .titulo-institucion h1{ font-size:1.05rem; } .escudo-marco{ width:56px; height:56px; } }
</style>
</head>

<script>
  /* =========================================================================
     CONFIGURACIÓN — usa el MISMO proyecto de Firebase que index.html
     -------------------------------------------------------------------------
     Antes de usar este panel en Firebase Console:
       1) Authentication → Sign-in method → habilita "Correo/contraseña".
       2) Authentication → Users → agrega manualmente cada cuenta de
          administrador (correo + contraseña). Solo así podrán entrar aquí;
          no hay registro público de administradores.
       3) Realtime Database → Rules → usa algo como:
          {
            "rules": {
              "denuncias": {
                ".read": "auth != null",
                "$id": {
                  ".read": true,
                  ".write": "!data.exists() || auth != null"
                }
              }
            }
          }
          Y para los VIDEOS (nodo aparte, agrégalo dentro de "rules"):
          "videos_denuncia": {
            ".read": "auth != null",
            "$id": { "$n": {
              ".read": true,
              ".write": "!data.exists() || auth != null",
              ".validate": "newData.isString() && newData.val().length < 14500000 && newData.val().beginsWith('data:video/')"
            } }
          }
          - Nadie puede LISTAR todas las denuncias sin ser administrador
            autenticado (eso protege ".read" en "denuncias").
          - PERO cualquiera que tenga el CÓDIGO exacto de una denuncia
            (el que se le entrega al denunciante) puede consultar SOLO esa
            denuncia puntual, gracias al ".read": true dentro de "$id".
            Esto es lo que usa consulta.html para el seguimiento por código.
          - Cualquiera puede CREAR una denuncia nueva; solo el admin
            autenticado puede modificarla después (cambiar el estado).
       4) Las imágenes de evidencia se guardan como texto (Base64) dentro
          de la misma denuncia — no se usa Firebase Storage ni ningún
          servicio externo, así que no hace falta el plan Blaze ni tarjeta.
     ========================================================================= */

  const firebaseConfig = {
    apiKey: "AIzaSyD-CYI-zIkzv29rxmX31kTDOTveYk_Rx9g",
    authDomain: "denuncias-satelite-norte.firebaseapp.com",
    databaseURL: "https://denuncias-satelite-norte-default-rtdb.firebaseio.com",
    projectId: "denuncias-satelite-norte",
    storageBucket: "denuncias-satelite-norte.firebasestorage.app",
    messagingSenderId: "108524743451",
    appId: "1:108524743451:web:6910a69bcf94fea29681be"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  const vistaLogin = document.getElementById('vistaLogin');
  const vistaPanel = document.getElementById('vistaPanel');
  const btnSalir = document.getElementById('btnSalir');
  const btnEntrar = document.getElementById('btnEntrar');
  const correoAdmin = document.getElementById('correoAdmin');
  const claveAdmin = document.getElementById('claveAdmin');
  const estadoLogin = document.getElementById('estadoLogin');
  const bandejaDenuncias = document.getElementById('bandejaDenuncias');
  const resumen = document.getElementById('resumen');
  const filtros = document.getElementById('filtros');

  let todasLasDenuncias = [];
  let filtroActivo = 'Nueva';
  let textoBusqueda = '';

  btnEntrar.addEventListener('click', async () => {
    estadoLogin.textContent = '';
    btnEntrar.disabled = true;
    try {
      await auth.signInWithEmailAndPassword(correoAdmin.value.trim(), claveAdmin.value);
    } catch (e) {
      estadoLogin.textContent = 'No se pudo iniciar sesión: correo o contraseña incorrectos.';
      console.error(e);
    } finally {
      btnEntrar.disabled = false;
    }
  });

  claveAdmin.addEventListener('keydown', (e) => { if(e.key === 'Enter') btnEntrar.click(); });

  btnSalir.addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged((usuario) => {
    if (usuario) {
      vistaLogin.style.display = 'none';
      vistaPanel.style.display = 'block';
      btnSalir.style.display = 'inline-block';
      escucharDenuncias();
    } else {
      vistaLogin.style.display = 'block';
      vistaPanel.style.display = 'none';
      btnSalir.style.display = 'none';
      db.ref('denuncias').off();
    }
  });

  function escucharDenuncias(){
    db.ref('denuncias').orderByChild('fecha').on('value', (snapshot) => {
      const datos = [];
      snapshot.forEach((hijo) => {
        datos.push({ id: hijo.key, ...hijo.val() });
      });
      datos.reverse(); // más recientes primero
      todasLasDenuncias = datos;
      renderizarResumen();
      renderizarGraficoTipos();
      renderizarLista();
    }, (error) => {
      bandejaDenuncias.innerHTML = '<p class="vacio">No se pudo cargar la lista: ' + error.message + '</p>';
    });
  }

  function renderizarResumen(){
    const total = todasLasDenuncias.length;
    const sinLeer = todasLasDenuncias.filter(d => !d.leida).length;
    const nuevas = todasLasDenuncias.filter(d => d.estado === 'Nueva').length;
    const revision = todasLasDenuncias.filter(d => d.estado === 'En revisión').length;
    const resueltas = todasLasDenuncias.filter(d => d.estado === 'Resuelta').length;
    resumen.innerHTML = `
      <div class="tarjetita"><div class="num">${total}</div><div class="etiqueta">Total de denuncias</div></div>
      <div class="tarjetita"><div class="num">${sinLeer}</div><div class="etiqueta">Sin leer</div></div>
      <div class="tarjetita"><div class="num">${nuevas}</div><div class="etiqueta">Nuevas</div></div>
      <div class="tarjetita"><div class="num">${revision}</div><div class="etiqueta">En revisión</div></div>
      <div class="tarjetita"><div class="num">${resueltas}</div><div class="etiqueta">Resueltas</div></div>
    `;
  }

  const graficoTipos = document.getElementById('graficoTipos');

  function renderizarGraficoTipos(){
    if(!todasLasDenuncias.length){
      graficoTipos.innerHTML = '<p class="vacio-grafico">Todavía no hay denuncias para graficar.</p>';
      return;
    }
    const conteo = {};
    todasLasDenuncias.forEach(d => {
      const tipo = d.tipo || 'Sin tipo';
      conteo[tipo] = (conteo[tipo] || 0) + 1;
    });
    const entradas = Object.entries(conteo).sort((a, b) => b[1] - a[1]);
    const maximo = Math.max(...entradas.map(e => e[1]));

    graficoTipos.innerHTML = entradas.map(([tipo, cantidad]) => {
      const porcentaje = Math.round((cantidad / maximo) * 100);
      return `
        <div class="barra-fila">
          <span class="etiqueta-barra">${escaparHtml(tipo)}</span>
          <div class="pista"><div class="relleno" style="width:${porcentaje}%"></div></div>
          <span class="num-barra">${cantidad}</span>
        </div>
      `;
    }).join('');
  }

  const buscadorDenuncias = document.getElementById('buscadorDenuncias');
  const buscadorWrap = document.getElementById('buscadorWrap');
  const limpiarBusqueda = document.getElementById('limpiarBusqueda');

  buscadorDenuncias.addEventListener('input', () => {
    textoBusqueda = buscadorDenuncias.value.trim();
    buscadorWrap.classList.toggle('tiene-texto', textoBusqueda.length > 0);
    renderizarLista();
  });

  limpiarBusqueda.addEventListener('click', () => {
    buscadorDenuncias.value = '';
    textoBusqueda = '';
    buscadorWrap.classList.remove('tiene-texto');
    renderizarLista();
    buscadorDenuncias.focus();
  });

  filtros.addEventListener('click', (e) => {
    const boton = e.target.closest('.pestana');
    if(!boton) return;
    filtroActivo = boton.dataset.filtro;
    [...filtros.children].forEach(b => b.classList.toggle('activa', b === boton));
    renderizarLista();
  });

  function escaparAttr(texto){
    return escaparHtml(texto).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Solo se muestran como imagen las evidencias con formato data:image válido
  function urlImagenSegura(ev){
    const url = ev && typeof ev.url === 'string' ? ev.url : '';
    return /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(url) ? url : '';
  }

  // Clase de color permitida para cada estado (evita insertar texto libre en el HTML)
  function claseEstado(estado){
    return ({'Nueva':'Nueva', 'En revisión':'En-revisión', 'Resuelta':'Resuelta'})[estado] || 'Nueva';
  }

  // Etiqueta visible según estado + si fue leída (igual que ve el estudiante)
  function etiquetaEstado(d){
    if(d.estado === 'Resuelta') return {texto:'Concluido', clase:'Resuelta'};
    if(d.estado === 'En revisión') return {texto:'En revisión', clase:'En-revisión'};
    return d.leida ? {texto:'Leída por dirección', clase:'Leida'} : {texto:'En espera', clase:'Espera'};
  }
  function valorSelect(d){
    if(d.estado === 'Resuelta') return 'concluido';
    if(d.estado === 'En revisión') return 'revision';
    return d.leida ? 'leida' : 'espera';
  }

  function escaparHtml(texto){
    const div = document.createElement('div');
    div.textContent = texto == null ? '' : String(texto);
    return div.innerHTML;
  }

  // ---- Visor de imagen ampliada (evita abrir pestañas nuevas con Base64 largo) ----
  const visorImagen = document.getElementById('visorImagen');
  const imagenVisor = document.getElementById('imagenVisor');
  const cerrarVisor = document.getElementById('cerrarVisor');

  bandejaDenuncias.addEventListener('click', (e) => {
    const boton = e.target.closest('.miniaturas-admin button');
    if(!boton) return;
    const img = boton.querySelector('img');
    if(!img) return;
    imagenVisor.src = img.src;
    visorImagen.classList.add('activo');
  });

  function cerrarImagenVisor(){
    visorImagen.classList.remove('activo');
    imagenVisor.src = '';
  }
  cerrarVisor.addEventListener('click', cerrarImagenVisor);
  visorImagen.addEventListener('click', (e) => {
    if(e.target === visorImagen) cerrarImagenVisor();
  });

  function normalizarTexto(texto){
    return String(texto || '')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // quita tildes para buscar sin acentos
  }

  const contadorResultados = document.getElementById('contadorResultados');

  function construirTarjetaHtml(d){
    const fecha = d.fecha ? new Date(d.fecha).toLocaleString('es-BO') : 'Sin fecha';
    const evidencia = (Array.isArray(d.evidencia) ? d.evidencia : []).filter(ev => urlImagenSegura(ev));
    const noLeida = !d.leida;
    const etq = etiquetaEstado(d);
    const videosMeta = Array.isArray(d.videos_meta) ? d.videos_meta : [];
    const vs = valorSelect(d);
    const miniaturas = evidencia.map(ev => {
      return `<button type="button"><img src="${urlImagenSegura(ev)}" loading="lazy" alt="Evidencia"></button>`;
    }).join('');

    return `
      <div class="denuncia ${d.estado === 'Resuelta' ? 'resuelta' : d.estado === 'En revisión' ? 'en-revision' : (noLeida ? 'no-leida' : '')}" data-id="${escaparAttr(d.id)}">
        <div class="denuncia-cabecera">
          <div>
            <div class="codigo">${noLeida ? '<span class="punto-no-leida"></span>' : ''}${escaparHtml(d.codigo_anonimo || d.id)}</div>
            <span class="etiqueta-tipo">${escaparHtml(d.tipo || 'Sin tipo')}</span>
          </div>
          <div class="fecha">${fecha}</div>
        </div>

        <div class="campo">
          <div class="rotulo">Persona denunciada</div>
          <div class="valor">${escaparHtml(d.denunciado_nombre || '—')} · ${escaparHtml(d.denunciado_posicion || '—')}${d.denunciado_curso ? ' · ' + escaparHtml(d.denunciado_curso) : ''}</div>
        </div>

        <div class="campo">
          <div class="rotulo">Detalle</div>
          <div class="valor">${escaparHtml(d.detalle || '—')}</div>
        </div>

        ${evidencia.length ? `
        <div class="campo">
          <div class="rotulo">Evidencia (${evidencia.length})</div>
          <div class="miniaturas-admin">${miniaturas}</div>
        </div>` : ''}

        ${videosMeta.length ? `
        <div class="campo">
          <div class="rotulo">Videos (${videosMeta.length})</div>
          <div class="videos-admin">${videosMeta.map((v, n) => bloqueVideoHtml(d.id, n, v)).join('')}</div>
        </div>` : ''}

        <div class="pie-denuncia">
          <div class="etiquetas-estado">
            <span class="etiqueta-fija">📨 Recibido por Dirección</span>
            <span class="pastilla-estado ${etq.clase}">${etq.texto}</span>
          </div>
          <select class="estado-select" data-id="${escaparAttr(d.id)}" aria-label="Cambiar estado">
            <option value="espera" ${vs === 'espera' ? 'selected' : ''}>En espera</option>
            <option value="leida" ${vs === 'leida' ? 'selected' : ''}>Leída por dirección</option>
            <option value="revision" ${vs === 'revision' ? 'selected' : ''}>En revisión</option>
            <option value="concluido" ${vs === 'concluido' ? 'selected' : ''}>Concluido</option>
          </select>
        </div>
      </div>
    `;
  }

  const TITULOS = {
    'Nueva': 'Denuncias nuevas, pendientes de revisar.',
    'En revisión': 'Denuncias que la dirección está revisando.',
    'Resuelta': 'Denuncias concluidas.'
  };

  // ---- Videos: se descargan solo al pulsar "Cargar video" y se guardan en memoria para no perderlos al re-dibujar ----
  const cacheVideos = new Map(); // "CODIGO|n" -> URL local del video
  function tamanoLegible(bytes){ if(!bytes) return ''; return bytes < 1048576 ? Math.max(1, Math.round(bytes / 1024)) + ' KB' : (bytes / 1048576).toFixed(1) + ' MB'; }
  function bloqueVideoHtml(id, n, meta){
    const clave = id + '|' + n;
    const nombre = escaparHtml((meta && meta.nombre) || ('Video ' + (n + 1)));
    const peso = tamanoLegible(meta && meta.tam);
    const url = cacheVideos.get(clave);
    return `
      <div class="video-item" data-clave="${escaparAttr(clave)}">
        <div class="video-info"><span>🎬 ${nombre}${peso ? ' · ' + peso : ''}</span>
          ${url ? '' : `<button type="button" class="btn-video" data-id="${escaparAttr(id)}" data-n="${n}">▶ Cargar video</button>`}
        </div>
        ${url ? `<video src="${url}" controls playsinline preload="metadata"></video>` : ''}
      </div>`;
  }

  bandejaDenuncias.addEventListener('click', async (e) => {
    const boton = e.target.closest('.btn-video');
    if(!boton) return;
    const id = boton.dataset.id, n = boton.dataset.n, clave = id + '|' + n;
    const contenedor = boton.closest('.video-item');
    boton.disabled = true; boton.textContent = 'Descargando...';
    try {
      const snap = await db.ref('videos_denuncia/' + id + '/' + n).once('value');
      const dataUrl = snap.val();
      if(typeof dataUrl !== 'string' || !/^data:video\/(mp4|webm|quicktime);base64,/.test(dataUrl)){
        throw new Error('El video no está disponible.');
      }
      const blob = await (await fetch(dataUrl)).blob();
      cacheVideos.set(clave, URL.createObjectURL(blob));
      renderizarLista();
    } catch (err) {
      boton.disabled = false; boton.textContent = '▶ Cargar video';
      let msg = contenedor.querySelector('.video-error');
      if(!msg){ msg = document.createElement('p'); msg.className = 'video-error'; contenedor.appendChild(msg); }
      msg.textContent = 'No se pudo cargar el video: ' + (err.message || err);
    }
  });

  function renderizarLista(){
    // contadores de cada pestaña (no cambian con la búsqueda)
    const cuenta = {'Nueva':0, 'En revisión':0, 'Resuelta':0};
    todasLasDenuncias.forEach(d => { cuenta[cuenta[d.estado] !== undefined ? d.estado : 'Nueva']++; });
    document.getElementById('cntNueva').textContent = cuenta['Nueva'];
    document.getElementById('cntRevision').textContent = cuenta['En revisión'];
    document.getElementById('cntResuelta').textContent = cuenta['Resuelta'];
    document.getElementById('tituloPestana').textContent = TITULOS[filtroActivo];

    let filtradas = todasLasDenuncias.filter(d => {
      const e = cuenta[d.estado] !== undefined ? d.estado : 'Nueva';
      return e === filtroActivo;
    });
    const totalPestana = filtradas.length;

    if(textoBusqueda){
      const q = normalizarTexto(textoBusqueda);
      filtradas = filtradas.filter(d => {
        const campos = [d.codigo_anonimo, d.tipo, d.denunciado_nombre, d.denunciado_posicion, d.denunciado_curso, d.detalle];
        return campos.some(campo => normalizarTexto(campo).includes(q));
      });
    }

    contadorResultados.textContent = textoBusqueda
      ? 'Mostrando ' + filtradas.length + ' de ' + totalPestana + ' denuncia(s) en esta pestaña'
      : '';

    const vacio = {
      'Nueva': '¡Todo al día! No hay denuncias nuevas.',
      'En revisión': 'No hay denuncias en revisión.',
      'Resuelta': 'Todavía no hay denuncias resueltas.'
    }[filtroActivo];
    bandejaDenuncias.innerHTML = filtradas.length
      ? filtradas.map(construirTarjetaHtml).join('')
      : '<p class="vacio">' + (textoBusqueda ? 'Nada coincide con tu búsqueda.' : vacio) + '</p>';
  }

  // Cambiar estado: solo se actualizan estos campos, el resto de la denuncia queda intacto
  bandejaDenuncias.addEventListener('change', (e) => {
    const select = e.target.closest('.estado-select');
    if(!select) return;
    const id = select.dataset.id;
    const MAPA = {
      espera:    {estado:'Nueva',       leida:false},
      leida:     {estado:'Nueva',       leida:true},
      revision:  {estado:'En revisión', leida:true},
      concluido: {estado:'Resuelta',    leida:true}
    };
    const m = MAPA[select.value];
    if(!m) return;
    db.ref('denuncias/' + id).update({
      estado: m.estado,
      leida: m.leida,
      fecha_actualizacion: firebase.database.ServerValue.TIMESTAMP
    }).catch(err => alert('No se pudo actualizar el estado: ' + err.message));
  });
</script>

</body>
</html>
